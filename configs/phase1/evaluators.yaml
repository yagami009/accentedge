# Evaluator configuration

content:
  asr_backend: faster-whisper
  model_size: small.en
  compute_wer: true
  compute_cer: true
  lazy_load: true  # Don't load model at import time

entities:
  enabled: true
  normalization:
    money:
      - pattern: "\\$([0-9]+(?:\\.[0-9]{2})?)"
        format: "USD:{1}"
      - pattern: "([0-9]+) dollars?"
        format: "USD:{1}.00"
      - pattern: "([0-9]+) cents?"
        format: "USD:0.{1}"
    date:
      - pattern: "(january|february|march|april|may|june|july|august|september|october|november|december) ([0-9]+)"
        format: "{2} {1.upper()}"
    time:
      - pattern: "([0-9]+) ([0-9]+)"
        format: "{1}:{2}"

identity:
  evaluators:
    - name: wavlm
      model: microsoft/wavlm-base-plus-sv
      enabled: true
      lazy_load: true
    - name: ecapa
      model: speechbrain/spkrec-ecapa-voxceleb
      enabled: true
      lazy_load: true
  calibration_path: data/calibration/identity.parquet

pronunciation:
  probe_registry: accentedge_benchmark.probes
  calibration_path: data/calibration/probes.parquet

naturalness:
  auto_evaluator: distill-mos
  model: microsoft/distill-mos
  lazy_load: true
  human_mos_required: true

timing:
  word_bounds_source: phase0_gold
  phrase_bounds_source: phase0_gold
  duration_tolerance_ms: 50

prosody:
  enabled: true
  f0_method: pyin
  energy_method: rms

artifacts:
  checks:
    - nan_inf
    - clipping
    - silence_insertion
    - duration_anomaly
    - dc_offset
    - rms_collapse
    - rms_explosion
    - spectral_discontinuity
  duration_bounds_ms: [100, 60000]  # 100ms to 60s per item
